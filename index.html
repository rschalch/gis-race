<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GIS Racing Simulator</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏁</text></svg>" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="map"></div>
    <div id="panel-triggers">
      <button id="routes-trigger">🛣 Routes</button>
      <button id="config-trigger">⚙ Configure Race</button>
    </div>
    <div id="routes-panel" hidden></div>
    <div id="config-panel" hidden></div>
    <div id="race-controls"></div>
    <div id="hud"></div>
    <div id="minimap-panel">
      <canvas id="minimap"></canvas>
      <div id="map-view-controls">
        <select id="basemap-select" aria-label="Basemap"></select>
        <label id="relief-toggle" title="3D terrain. Costs DEM tiles and CPU to decode.">
          <input type="checkbox" id="relief-enabled" /> Relief
        </label>
        <input type="range" id="relief-exaggeration" min="1" max="4" step="0.2" value="1.8"
               aria-label="Relief exaggeration" title="Vertical exaggeration" />
      </div>
      <div id="curvature-legend">
        <span class="legend-title">Corner radius</span>
        <span class="legend-scale"></span>
        <span class="legend-ends"><span>tight</span><span>open</span></span>
      </div>
    </div>
    <canvas id="profile"></canvas>
    <div id="summary" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
